<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/order-forms/hollister-feel-good-fleece/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#07070A">
<title>Feel Good Fleece Ordering</title>
<link rel="icon" href="https://xqaybwhpgxillpbbqtks.supabase.co/storage/v1/object/public/campaign-media/postgame-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600&family=Archivo+Black&family=Arimo:wght@400;700&family=Bebas+Neue&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --kbh:0px;
  --pg-black:#07070A; --pg-orange:#D73F09; --pg-off:#FAF8F5;
  --ink-100:rgba(250,248,245,1); --ink-90:rgba(250,248,245,.9); --ink-68:rgba(250,248,245,.68); --ink-50:rgba(250,248,245,.5);
  --raised:rgba(250,248,245,.07); --raised-b:rgba(250,248,245,.14); --card:rgba(250,248,245,.04); --card-b:rgba(250,248,245,.10);
  --display:'Bebas Neue',Impact,sans-serif; --black:'Arial Black','Archivo Black',Arial,sans-serif; --tech:'JetBrains Mono',ui-monospace,monospace; --hollister:'Antonio','Oswald','Arial Narrow',sans-serif; --body:Arial,'Arimo',sans-serif; --mono:Arial,'Arimo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink-68);font:16px/1.7 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}

/* The "phone". On a real phone it is pinned to the visible area above the keyboard (see keyboard script). */
.story{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(120% 60% at 100% 0%,rgba(215,63,9,.20),transparent 60%),
  radial-gradient(90% 50% at 0% 100%,rgba(250,248,245,.05),transparent 60%),var(--pg-black)}
.story.kb{--sab:0px}

/* Tablets (touch, wide): the form sits in a phone-width column in the middle */
@media (min-width:600px) and (pointer:coarse){
  body{background:var(--pg-black)}
  .story{left:calc(50% - 240px);width:480px;border-left:1px solid var(--card-b);border-right:1px solid var(--card-b)}
}
/* Phone turned sideways: ask them to turn it upright (story slides need the height) */
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:100;background:var(--pg-black);flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));text-align:center}
  .rotate b{font:400 34px/1 var(--display);letter-spacing:.02em;color:var(--pg-off)}
  .rotate span{font-size:16px;color:var(--ink-68)}
  .rotate svg{color:var(--pg-orange)}
}

/* iPhone preview frame — only on a computer (wide screen + mouse), never on a phone or tablet */
.device{display:contents}
.statusbar,.island,.devlabel,.fakekb{display:none}
@media (min-width:600px) and (hover:hover) and (pointer:fine){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 60% at 50% 40%,#16161b,var(--pg-black))}
  .device{display:block;position:relative;flex:0 0 auto;width:417px;height:876px;padding:12px;border-radius:68px;background:#1c1c21;
    box-shadow:inset 0 0 0 2px #3b3b42,inset 0 0 0 6px #111114;transform:scale(var(--fit,1));transform-origin:center}
  .story{position:relative;--sat:54px;--sab:28px;width:393px;height:852px;border-radius:56px}
  .story.kb{--sab:0px;--kbh:291px}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:30}
  .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;z-index:25;align-items:center;justify-content:space-between;
    padding:4px 30px 0 46px;font:600 16px/1 -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:var(--pg-off)}
  .statusbar .ic{display:flex;gap:6px;align-items:center}
  .story::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(250,248,245,.85);z-index:30;pointer-events:none}
  .devlabel{display:block;position:absolute;left:0;right:0;bottom:-34px;text-align:center;font:700 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-50)}
  /* Pretend iOS keyboard so the preview shows where Next lands when typing */
  .fakekb{display:flex;flex-direction:column;gap:11px;position:absolute;left:0;right:0;bottom:0;height:291px;z-index:20;padding:8px 3px 0;
    background:rgba(43,43,46,.96);backdrop-filter:blur(20px);transform:translateY(100%);transition:transform .28s ease;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .story.kb .fakekb{transform:none}
  .fakekb .row{display:flex;gap:6px;justify-content:center;padding:0 3px}
  .fakekb .k{flex:0 0 33px;height:42px;border-radius:5px;background:#6b6b6f;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
  .fakekb .k.d{background:#46464a;font-size:15px}.fakekb .k.w{flex:0 0 44px}.fakekb .k.sp{flex:1}.fakekb .k.rt{flex:0 0 88px;font-size:15px}
  .fakekb.num .row{gap:6px}.fakekb.num .k{flex:1;height:46px;flex-direction:column;font-size:24px;line-height:1}.fakekb.num .k small{font-size:9px;letter-spacing:.07em;margin-top:2px}
  .fakekb.num .k.e{background:none}
  .fakekb .letters,.fakekb .numpad{display:flex;flex-direction:column;gap:11px}
  .fakekb .numpad{display:none}.fakekb.num .numpad{display:flex}.fakekb.num .letters{display:none}
}

/* Story progress bars */
.bars{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;gap:4px;padding:calc(12px + var(--sat)) 14px 0}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(250,248,245,.18);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;width:0;background:var(--ink-100);transition:width .35s ease}
.bars i.done::after{width:100%}
.bars i.now::after{width:100%;background:var(--pg-orange)}

/* Top row: back arrow + lockup, test chip */
.top{position:absolute;top:calc(26px + var(--sat));left:0;right:0;height:32px;z-index:6;display:flex;align-items:center;padding:0 18px}
.left{display:flex;align-items:center;gap:6px}
.backArrow{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-left:-8px;background:none;border:0;color:var(--pg-off);cursor:pointer;border-radius:50%}
.backArrow:focus-visible{outline:2px solid var(--pg-orange)}
.backArrow[hidden]{display:none}
.lockup{display:flex;align-items:center;gap:12px;transition:opacity .3s;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.lockup img{display:block;width:auto}
.lockup .pg{height:17px}.lockup .hol{height:15px}
.lockup .rule{width:1px;align-self:stretch;min-height:20px;background:rgba(250,248,245,.4)}
.top.hideLock .lockup{opacity:0}
.chip{font:700 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid rgba(215,63,9,.5);color:var(--pg-orange);background:rgba(7,7,10,.5)}

/* Slides — the area shrinks when a keyboard is up (--kbh) */
.slides{position:absolute;top:0;left:0;right:0;bottom:var(--kbh);transition:bottom .28s ease}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(84px + var(--sat)) 24px calc(20px + var(--sab));
  opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .32s ease,transform .32s ease}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide.left{transform:translateX(-40px)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;min-height:0;overflow-y:auto;scrollbar-width:none;padding-top:8px}
.body::-webkit-scrollbar{display:none}
.story.kb .slide .body{justify-content:flex-end;padding-bottom:8px}

.count{font:700 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--pg-orange);margin-bottom:14px}
.count span{color:var(--ink-50)}
.q{font:400 54px/.92 var(--display);color:var(--ink-100);margin-bottom:12px;letter-spacing:.005em}
.help{font-size:16px;line-height:1.5;color:var(--ink-68);margin-bottom:24px;max-width:340px}
.help b{color:var(--ink-90)}
.help a{color:var(--pg-orange);font-weight:700}

/* Big story-style input */
.big{width:100%;font:400 52px/1.1 var(--display);letter-spacing:.02em;color:var(--ink-100);background:transparent;border:0;
  border-bottom:2px solid var(--raised-b);padding:6px 0 12px;outline:none;border-radius:0;transition:border-color .2s}
.big::placeholder{color:rgba(250,248,245,.36)}
.big:focus{border-bottom-color:var(--pg-orange)}
select.big{appearance:none;-webkit-appearance:none;cursor:pointer}
select.big option{font:16px var(--body);background:#16161a;color:var(--pg-off)}
select.big:has(option[value=""]:checked){color:rgba(250,248,245,.36)}
.big2{font-size:30px;margin-top:18px}
.q + .big, .help + .big{font-size:40px}
.solo .help{order:2;margin:14px 0 0}
.solo .err{order:3}
.autofill{order:2;display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:700 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--pg-orange)}
.autofill[hidden]{display:none}
.err{min-height:22px;margin-top:10px;font-size:14px;color:#ff8a63}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Gender — two tall tiles side by side */
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{position:relative;cursor:pointer;border-radius:18px;background:var(--raised);border:1px solid var(--raised-b);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 22px;transition:background .2s,border-color .2s,transform .15s}
.tile:active{transform:scale(.98)}
.tile input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tile .ring{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--raised-b);display:flex;align-items:center;justify-content:center}
.tile .ring svg{opacity:0}
.tile b{font:400 40px/.9 var(--display);color:var(--ink-100);letter-spacing:.01em}
.tile:has(input:checked){background:var(--pg-orange);border-color:var(--pg-orange)}
.tile:has(input:checked) .ring{background:#fff;border-color:#fff}.tile:has(input:checked) .ring svg{opacity:1}
.tile:has(input:focus-visible){outline:2px solid var(--pg-off);outline-offset:2px}

/* Sizes — a grid of big square tiles */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{position:relative;cursor:pointer;aspect-ratio:1/.86;border-radius:18px;background:var(--raised);border:1px solid var(--raised-b);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s}
.size:active{transform:scale(.97)}
.size input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.size b{font:400 40px/1 var(--display);color:var(--ink-100);letter-spacing:.02em}
.size.wide{grid-column:1/-1;aspect-ratio:auto;padding:18px}
.size.wide b{font:700 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-90)}
.size:has(input:checked){background:var(--pg-orange);border-color:var(--pg-orange)}
.size:has(input:checked) b{color:#fff}
.size:has(input:focus-visible){outline:2px solid var(--pg-off);outline-offset:2px}

/* Outfit — full-screen cards, swipe sideways.
   Front = flat-lay of Adobe cutouts on a sky-blue board. Back = the same pieces on model (Hollister photos). */
.slide.ofslide{padding:0}
.carousel{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.ofit{flex:0 0 100%;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;padding:calc(70px + var(--sat)) 14px calc(18px + var(--sab))}
.flip{flex:1;min-height:0;position:relative;perspective:1400px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ofit.flipped .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:#E9E5DD}
.board{background:#9AACBA url("images/sky.jpg") center/cover no-repeat;padding:16px 14px 18px;display:grid;gap:4px}
.board img{width:100%;height:100%;min-height:0;object-fit:contain;display:block;filter:drop-shadow(0 10px 16px rgba(20,35,50,.28))}
.board.l3{grid-template-columns:1.12fr .88fr;grid-template-rows:1fr 1fr;grid-template-areas:"a c" "b c"}
.board.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"a b" "c d";gap:10px}
.board .i0{grid-area:a}.board .i1{grid-area:b}.board .i2{grid-area:c}.board .i3{grid-area:d}
.board.empty{display:flex;align-items:center;justify-content:center}
.board .slot{font:700 10px/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:rgba(7,7,10,.55);text-align:center;border:1px dashed rgba(7,7,10,.3);border-radius:14px;padding:22px 26px}
.models{display:grid;gap:2px;height:100%}
.models.n1{grid-template-columns:1fr}.models.n1 img{object-position:50% 20%}
.models.n2 img{object-position:50% 30%}
.models.n2{grid-template-columns:1fr 1fr}
.models.n3{grid-template-columns:1.2fr .8fr;grid-template-rows:1fr 1fr}.models.n3 img:first-child{grid-row:1/3}
.models.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.models img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;min-height:0}
.tapZone{position:absolute;inset:0;z-index:3;border:0;background:none;cursor:pointer;border-radius:22px}
.tapZone:focus-visible{outline:2px solid var(--pg-orange);outline-offset:2px}
.seg{position:absolute;top:10px;left:14px;right:14px;z-index:4;display:flex;gap:4px;pointer-events:none}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.seg i:first-child,.ofit.flipped .seg i:last-child{background:#fff}.ofit.flipped .seg i:first-child{background:rgba(255,255,255,.4)}
.tapHint{position:absolute;right:12px;top:12px;z-index:4;pointer-events:none}
.tapHint span{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:10px;font:400 12px/1 var(--black);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.swapIc{width:44px;height:44px;padding:11px;box-sizing:border-box;border-radius:50%;background:var(--pg-orange);box-shadow:0 4px 14px rgba(0,0,0,.25);flex:0 0 auto}
.swapIc path[stroke]{stroke:#fff}.swapIc path[fill]{fill:#fff}
.tapHint .h2,.ofit.flipped .tapHint .h1{display:none}.ofit.flipped .tapHint .h2{display:inline-flex}
.ofit.sel .face.front{box-shadow:inset 0 0 0 3px var(--pg-orange)}
.selTag{position:absolute;bottom:12px;left:12px;z-index:4;display:none;align-items:center;gap:6px;background:var(--pg-orange);color:#fff;border-radius:999px;padding:7px 11px;font:700 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.ofit.sel .selTag{display:inline-flex}
.ofit .info{padding:16px 10px 0}
.ofit .count{margin-bottom:10px}
.ofit h3{font:400 40px/.92 var(--display);color:var(--ink-100);margin:0 0 8px}
.ofit .items{font-size:13px;line-height:1.45;color:var(--ink-68)}
.pieceline{font:700 14px/1.45 var(--body);color:var(--ink-68);max-width:340px}
.count em{font-style:normal}
.psize .pcard{height:clamp(150px,30vh,230px);border-radius:22px;background:#9AACBA url("images/sky.jpg") center/cover;display:flex;align-items:center;justify-content:center;margin-bottom:18px;flex:0 0 auto}
.psize .pcard img{height:86%;max-width:80%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(20,35,50,.28))}
.psize .q{margin-bottom:6px}
.pname{font-size:15px;line-height:1.4;color:var(--ink-90);margin-bottom:18px}.pname span{color:var(--ink-50)}
.ofrow{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.dots{display:flex;gap:6px}
.dots button{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:rgba(250,248,245,.3);cursor:pointer;transition:width .2s}
.dots button.on{width:20px;background:var(--pg-off)}
.swipe{display:none;align-items:center;gap:6px;font:700 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-50)}
.ofit .pick{width:100%}
.carousel.nudge .ofit{animation:nudge 1.5s .45s cubic-bezier(.45,0,.25,1)}
@keyframes nudge{0%{transform:none}35%{transform:translateX(-64px)}62%{transform:translateX(6px)}80%{transform:translateX(-18px)}100%{transform:none}}
.swipeHint{position:absolute;right:-4px;top:50%;z-index:6;transform:translateY(-50%);display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;
  border-radius:999px 0 0 999px;background:var(--pg-orange);color:#fff;font:500 11px/1 var(--tech);letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;animation:hintIn .4s .3s both,hintPulse 1.2s 1.9s ease-in-out 3;transition:opacity .3s}
.swipeHint svg{animation:arrowGo 1s ease-in-out infinite}
.swipeHint.gone{opacity:0}
@keyframes hintIn{from{opacity:0;transform:translate(20px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes hintPulse{50%{transform:translate(-6px,-50%)}}
@keyframes arrowGo{50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.swipeHint,.swipeHint svg{animation:none}}
.ofit.sel .pick{background:var(--pg-off);color:var(--pg-black)}
.ofslide .err{position:absolute;left:24px;right:24px;bottom:calc(92px + var(--sab));z-index:3;min-height:0;text-align:center}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}}

/* Intro — centered: lockup is the hero, campaign name sits under it on one line */
.intro .body{align-items:center;text-align:center}
.bigLock{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
.bigLock .pg{height:30px;width:auto}.bigLock .hol{height:26px;width:auto}
.bigLock .rule{width:1px;height:46px;background:rgba(250,248,245,.45)}
.intro .eyebrow{font:700 11px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--pg-orange);margin:0 0 44px .32em}
.intro h1{font:600 clamp(24px,7.4vw,30px)/1 var(--hollister);color:var(--pg-off);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;margin-bottom:30px}
.intro .lead{font-size:16px;line-height:1.55;color:var(--ink-68);max-width:270px}
.intro .meta{display:flex;gap:18px;justify-content:center;margin-top:28px;font:700 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-50)}
.intro .meta span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-50);margin-right:18px;vertical-align:middle}

/* Review */
.review .body{justify-content:flex-start}
.rvList{border-top:1px solid var(--raised-b)}
.rvRow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;background:none;border:0;border-bottom:1px solid var(--raised-b);cursor:pointer;text-align:left;color:inherit}
.rvRow span{flex:0 0 112px;font:700 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-50)}
.rvRow b{flex:1;min-width:0;font:700 15px/1.35 var(--body);color:var(--ink-100);word-break:break-word}
.rvRow i{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;font:700 11px/1 var(--mono);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--pg-orange)}
.rvRow:focus-visible{outline:2px solid var(--pg-orange);outline-offset:2px}

/* Footer controls */
.foot{display:flex;gap:10px;align-items:center;padding-top:14px}
.btn{font:500 13px/1 var(--tech);letter-spacing:.14em;text-transform:uppercase;border-radius:12px;padding:19px 22px;cursor:pointer;border:1px solid transparent;transition:.2s}
.btn.primary{flex:1;background:var(--pg-orange);color:#fff}
.btn.primary:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--ink-90);padding:19px 18px}
.hintkey{font:700 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-50);text-align:center;margin-top:10px}
.story.kb .hintkey{display:none}
@media (hover:none){.hintkey{display:none}}

/* Done */
.done .body{align-items:center;text-align:center}
.done .help{margin-left:auto;margin-right:auto;max-width:300px}

.doneCard .chip2{cursor:default}
.ship{flex:0 0 auto;width:100%;max-width:340px;margin-top:10px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--raised);border:1px solid var(--raised-b);text-align:left}

<script>
/* ============================================================
   CAMPAIGN SETTINGS — edit these per campaign
   ============================================================ */
const CAMPAIGN = "Feel Good Fleece";

// Where submissions go. In the Hub this is "/api/order-forms/submit" — the Hub's own
// endpoint, which forwards the order to the Google Sheet and reports back whether it landed.
// While it's empty, the page runs in TEST MODE (nothing is sent anywhere).
const SHEET_URL = "/api/order-forms/submit";
// Which order form this is. The Hub endpoint uses it to pick the right Sheet.
const FORM_ID = "hollister-feel-good-fleece";

// Link to the campaign agreement, shown on the terms slide. Leave "" to hide the link.
const TERMS_URL = "";

// Estimated delivery shown on the "Order received" screen. Leave "" until dates are confirmed.
const DELIVERY_WINDOW = "";   // e.g. "Nov 3 – Nov 10"

// Shown on the ZIP slide. Leave "" if there's no date window yet.
const SHIP_WINDOW = "from now until the end of October";

// Outfit options, from Hollister's Girls and Guys Feel Good Favorites product guides.
//   gender: which athletes see it ("Women's" or "Men's")
//   sheet:  exactly what gets written in the Sheet's Outfit column (must match the dropdown in Code.gs)
//   desc:   the short piece list shown under the outfit name
//   items:  [Hollister product code, "Product name · Color", category]
//           category decides the size question and Sheet column: jacket · hoodie · top · pants
//   Product cutouts (background removed in Adobe) live in images/cut/, on-model photos in images/model/
const OUTFITS = [
  { gender:"Women's", name:"Espresso & Grey", looks:["espresso-duo"], sheet:"Espresso & Grey — Girls Contracted Outfit 3", desc:"Espresso puffer, grey faux-fur zip hoodie, grey sweatpants, white V-neck",

           ["347-6136-00474-112","Low-Rise Logo Baggy Sweatpants · Heather Grey","pants"],["357-6223-00057-101","Malibu Long-Sleeve V-Neck · White","top"]] },
  { gender:"Women's", name:"Ballet Pink", looks:["pink-duo"], sheet:"Ballet Pink — Girls Gifting Option 1", desc:"Light pink puffer, pink hoodie, pink sweatpants",
    items:[["344-6037-00083-630","Feel Good Puffer Jacket · Light Pink","jacket"],["352-6248-00557-600","Feel Good Oversized Hoodie · Pink","hoodie"],
           ["347-6121-00463-675","Feel Good Low-Rise Baggy Sweatpants · Pink","pants"]] },
  { gender:"Women's", name:"Black Leopard", looks:["black-puffer"], sheet:"Black Leopard — Girls Gifting Option 2", desc:"Black puffer, leopard hoodie, leopard sweatpants",
    items:[["344-6033-00080-900","Feel Good Puffer Jacket · Black","jacket"],["352-6257-00480-908","Feel Good Oversized Hoodie · Leopard","hoodie"],
           ["347-6087-00411-478","Low-Rise Baggy Sweatpants · Leopard Print","pants"]] },
  { gender:"Men's", name:"Big Sky Navy", looks:["big-sky"], sheet:"Big Sky Navy — Guys Gifting Option 1", desc:"Black fur trim hoodie, white crewneck thermal, black ultra baggy sweatpants",
    items:[["322-26033-00228-901","Big Sky Fur Trim Hoodie · Black","hoodie"],["324-6365-00662-178","Long-Sleeve Crewneck Thermal · White","top"],
           ["334-6135-00387-900","Feel Good Ultra Baggy Sweatpants · Black","pants"]] },
  { gender:"Men's", name:"Washed Red", looks:["washed-red"], sheet:"Washed Red — Guys Gifting Option 2", desc:"Washed red zip hoodie, grey button-through thermal, heather grey ultra baggy sweatpants",
    items:[["322-6272-00181-508","Feel Good Boxy Full-Zip Hoodie · Washed Red","hoodie"],["324-6370-00043-113","Button-Through Long-Sleeve Thermal · Grey","top"],
           ["334-26000-00377-122","Feel Good Ultra Baggy Sweatpants · Heather Grey","pants"]] },
  { gender:"Men's", name:"Mocha & Cream", looks:["brown-cream"], sheet:"Mocha & Cream — Guys Gifting Option 3", desc:"Brown zip hoodie, white graphic thermal, cream ultra baggy sweatpants",
    items:[["322-6274-00198-420","Feel Good Boxy Full-Zip Hoodie · Brown","hoodie"],["323-6857-01227-178","Graphic Long-Sleeve Crewneck Thermal · White","top"],
           ["334-6121-00428-155","Feel Good Ultra Baggy Sweatpants · Cream","pants"]] },
];
// Products that have an on-model photo on Hollister's site (four hoodies don't)
const MODEL_PHOTOS = ["322-26033-00228-901","323-6857-01227-178","324-6365-00662-178","324-6370-00043-113","334-26000-00377-122","334-6121-00428-155","334-6135-00387-900",
  "344-6033-00080-440","344-6033-00080-900","344-6037-00083-630","347-6087-00411-478","347-6121-00463-675","347-6136-00474-112","352-6211-00178-112","357-6223-00057-101"];
// looks: full-outfit on-model photos in images/look/ (Higgsfield edits, approved by Peyton) — shown instead of per-item photos
const SRC = (kind, code) => `images/${kind}/${code}.${kind==="cut"?"webp":"jpg"}`;

// Size runs by fit (Hollister's standard ranges)
const SIZE_RUNS = { "Women's":["XXS","XS","S","M","L","XL"], "Men's":["XS","S","M","L","XL","XXL"] };
const CAT = { jacket:{q:"Jacket size?", col:"puffer"}, hoodie:{q:"Hoodie size?", col:"hoodie"}, top:{q:"Top size?", col:"shirt"}, pants:{q:"Sweatpants size?", col:"pants"} };
/* ============================================================ */

const STATES = "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
const TEST = !SHEET_URL;

/* Every slide = one question. `key` is the field name sent to the Sheet. */
const SLIDES = [
  { type:"intro" },
  { key:"terms", type:"terms", q:"Campaign terms",
    help:()=>`By completing this order form you are hereby opting into the Hollister NIL campaign with Postgame and agreeing to the deliverables and payment that was quoted in the text message you received.${TERMS_URL?` <a href="${TERMS_URL}" target="_blank" rel="noopener">Read the agreement</a>`:""}` },
  { key:"first_name", type:"text", ph:"First name", ac:"given-name", cap:"words" },
  { key:"last_name",  type:"text", ph:"Last name",  ac:"family-name", cap:"words" },
  { key:"instagram",  type:"text", help:"Make sure it's spelled exactly right. This is how we find your post.", ph:"Instagram handle", ac:"off", cap:"none",
    check:v=>/^@?[A-Za-z0-9._]{1,30}$/.test(v) || "Handles are letters, numbers, periods and underscores only." },
  { key:"school",     type:"text", ph:"School", ac:"organization", cap:"words" },
  { key:"gender",     type:"gender", q:"Gender?", help:"So we send the right cut.", opts:[["Men's","Men's fit"],["Women's","Women's fit"]] },
  { key:"outfit",     type:"outfit", q:"Pick your outfit." },
  { key:"psize0", type:"psize", slot:0 },   // size slides are built from the outfit the athlete picked;
  { key:"psize1", type:"psize", slot:1 },   // a slot with no product in that outfit is skipped
  { key:"psize2", type:"psize", slot:2 },
  { key:"psize3", type:"psize", slot:3 },
  { key:"zip",        type:"text", ph:"ZIP code", ac:"postal-code", mode:"numeric", tag:"Ship to", max:5,
    help:()=> (SHIP_WINDOW ? `This <b>must</b> be where you'll be ${SHIP_WINDOW}.` : `Where you'll be when it ships. Campus mailrooms work.`) + ` We'll fill in your city and state.`,
    check:v=>/^\d{5}$/.test(v) || "Enter a 5-digit ZIP." },
  { key:"city",       type:"text", ph:"City", ac:"address-level2", tag:"Ship to", cap:"words", auto:true },
  { key:"state",      type:"state", tag:"Ship to", auto:true },
  { key:"street",     type:"address", q:"Street address?", ph:"Street address", ph2:"Apt, dorm, room (optional)", tag:"Ship to",
    help:()=>`Put the address where you'll be <b>${SHIP_WINDOW || "when it ships"}</b>.` },
  { type:"review" },
  { type:"done" },
];
const QUESTIONS = SLIDES.filter(s=>s.key);
const LABELS = {terms:"Campaign terms",first_name:"First name",last_name:"Last name",instagram:"Instagram",school:"School",gender:"Gender",outfit:"Outfit",
  zip:"ZIP",city:"City",state:"State",street:"Street"};

const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
const form = $("#form"), story = $("#story"); let cur = 0;
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const check = (c="#fff",w=13)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

/* ---------- build slides ---------- */
function slideHTML(s,i){
  const count = `<div class="count"><em data-n></em>${s.tag?` <span>· ${s.tag}</span>`:""}</div>`;
  const help = s.help ? `<p class="help">${typeof s.help==="function"?s.help():s.help}</p>` : "";
  const foot = (label="Next")=>`<div class="foot"><button type="submit" class="btn primary">${label}</button></div><div class="hintkey">Press Enter ↵</div>`;

  if (s.type==="intro") return `<section class="slide intro" data-i="${i}"><div class="body">
      <div class="eyebrow">Athlete ordering</div>
      <div class="bigLock">
        <img class="pg" src="https://xqaybwhpgxillpbbqtks.supabase.co/storage/v1/object/public/campaign-media/brand-kits/1774632055938-16gy1u2t.PNG" alt="Postgame">
        <span class="rule" aria-hidden="true"></span>
        <img class="hol" src="https://xqaybwhpgxillpbbqtks.supabase.co/storage/v1/object/public/campaign-media/brand-kits/1775490788077-i5q6wg3l.png" alt="Hollister">
      </div>
      <h1>${esc(CAMPAIGN)}</h1>
      <p class="lead">Pick your outfit, lock in your sizes, tell us where to ship it.</p>
      <div class="meta"><span>One tap per screen</span><span>~2 min</span></div>
    </div><div class="foot"><button type="submit" class="btn primary">Let's go</button></div></section>`;

  if (s.type==="review") return `<section class="slide review" data-i="${i}"><div class="body">
      <div class="count">Last step</div><div class="q">Look right?</div>
      <p class="help">Tap a line to change it.</p>
      <div id="review"></div><div class="err" role="alert"></div></div>${foot("Submit")}</section>`;

  if (s.type==="done") return `<section class="slide done" data-i="${i}"><canvas class="confetti" aria-hidden="true"></canvas><div class="body">
      <div class="icon"><svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#D73F09"/><path class="tick" d="M19 33l9 9 17-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="q a1">Order received</div>
      <p class="help a2" id="doneMsg">We'll ship your ${esc(CAMPAIGN)} outfit to the address you gave us.</p>
      <div class="doneCard a3"><div class="ph"><img id="doneImg" alt=""><div class="ov"><small>Your outfit</small><b id="doneName"></b></div></div><ul class="prodRows" id="doneSizes"></ul></div>
      <div class="ship a4"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg></span>
        <div><small>Look out for your order</small><b>Estimated delivery</b><em id="doneDate"></em></div></div>
      <div class="devbox" id="devbox" hidden><h4>Test mode · the row that would land in the Sheet</h4><pre id="devrow"></pre>
        <div class="row"><button type="button" class="btn ghost" id="dlCsv">Download test rows</button><button type="button" class="btn ghost" id="again">Start over</button></div></div>
    </div></section>`;

  if (s.type==="outfit") return `<section class="slide ofslide" data-i="${i}">
      <input type="hidden" name="outfit">
      <div class="carousel" id="carousel" tabindex="0"></div>
      <div class="err"></div>
    </section>`;

  if (s.type==="psize") return `<section class="slide psize" data-i="${i}"><div class="body">
      <div class="count"><em data-n></em> <span>· Your sizes</span></div>
      <div class="pcard"><img alt=""></div>
      <div class="q"></div><p class="pname"></p>
      <div class="sizes"></div><div class="err"></div></div>${foot()}</section>`;

  let field = "";
  if (s.type==="text") field = `<input class="big" name="${s.key}" placeholder="${s.ph||""}" autocomplete="${s.ac||"on"}" ${s.mode?`inputmode="${s.mode}" pattern="[0-9]*"`:""} ${s.max?`maxlength="${s.max}"`:""} ${s.cap?`autocapitalize="${s.cap}"`:""} ${s.cap==="none"?`spellcheck="false"`:""} enterkeyhint="next">`;
  if (s.type==="address") field = `<input class="big" name="street" placeholder="${s.ph}" autocomplete="address-line1" autocapitalize="words" enterkeyhint="next"><input class="big big2" name="street2" placeholder="${s.ph2}" autocomplete="address-line2" enterkeyhint="next">`;
  if (s.type==="state") field = `<select class="big" name="state" autocomplete="address-level1"><option value="">State ▾</option>${STATES.map(x=>`<option>${x}</option>`).join("")}</select>`;
  if (s.type==="gender") field = `<div class="tiles">${s.opts.map(([v,sub])=>`<label class="tile opt"><input type="radio" name="${s.key}" value="${esc(v)}"><b>${esc(v)}</b><span class="ring">${check("#D73F09",13)}</span></label>`).join("")}</div>`;
  if (s.type==="terms") field = `<div class="tiles"><label class="tile opt"><input type="checkbox" name="terms" value="Agreed"><b>I agree</b><span class="ring">${check("#D73F09",13)}</span></label></div>`;
  if (s.type==="size") field = `<div class="sizes">${s.opts.map(o=>`<label class="size opt ${o.length>4?"wide":""}"><input type="radio" name="${s.key}" value="${esc(o)}"><b>${esc(o)}</b></label>`).join("")}</div>`;
  const auto = s.auto ? `<div class="autofill" data-auto="${s.key}" hidden>${check("#D73F09",11)} Filled in from your ZIP</div>` : "";
  return `<section class="slide" data-i="${i}"><div class="body ${s.q?"":"solo"}">${count}${s.q?`<div class="q">${s.q}</div>`:""}${help}${field}${auto}<div class="err"></div></div>${foot()}</section>`;
}
form.innerHTML = SLIDES.map(slideHTML).join("");
$("#bars").innerHTML = SLIDES.slice(0,-1).map(()=>"<i></i>").join("");

/* tap-to-pick options advance on their own, like tapping through a story */
$$(".opt input").forEach(r=>r.addEventListener("change",()=>{ setTimeout(()=>{ if(cur===+r.closest(".slide").dataset.i) next(); },280); }));

/* outfit carousel — rebuilt each time so it only shows outfits for the gender picked */
const carousel = $("#carousel");
let shown = [];
const flipIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>`;
function goCard(k){ carousel.scrollTo({left:k*carousel.clientWidth,behavior:"smooth"}); }
function renderOutfits(){
  const g = val("gender");
  shown = OUTFITS.filter(o=>!g || o.gender===g);
  const chosen = val("outfit");
  carousel.innerHTML = shown.map((o,k)=>{
    const sel = o.sheet===chosen;
    const front = o.items.length
      ? o.items.map(([code,label],j)=>`<img class="i${j}" src="${SRC("cut",code)}" alt="${esc(label)}" loading="lazy">`).join("")
      : `<div class="slot">Product photos<br>coming soon</div>`;
    const models = o.items.filter(([code])=>MODEL_PHOTOS.includes(code));
    const looks = o.looks || [];
    const back = looks.length
      ? `<div class="models n${looks.length}">${looks.map(l=>`<img src="${SRC("look",l)}" alt="${esc(o.name)} outfit on model" loading="lazy">`).join("")}</div>`
      : `<div class="models n${Math.min(models.length,4)}">${models.map(([code,label])=>`<img src="${SRC("model",code)}" alt="${esc(label)} on model" loading="lazy">`).join("")}</div>`;
    const short = o.desc || "";
    const list = `<p class="pieceline">${esc(short.charAt(0).toUpperCase()+short.slice(1))}</p>`;
    const hint = (k===0 && !chosen && shown.length>1) ? `<div class="swipeHint" aria-hidden="true">Swipe <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>` : "";
    return `<article class="ofit ${sel?"sel":""}" data-k="${k}">
      <div class="flip">${hint}<div class="flipper">
        <div class="face front board ${o.items.length===4?"l4":o.items.length?"l3":"empty"}">${front}
          <span class="selTag">${check("#fff",10)} Your pick</span></div>
        <div class="face back">${back}</div>
      </div>${(models.length||looks.length)?`<div class="tapHint" aria-hidden="true"><span class="h1"><svg class="swapIc" width="22" height="18" viewBox="0 0 44 36" fill="none" aria-hidden="true"><path d="M6 15C6 9 15 5 27 5h4" stroke="#D73F09" stroke-width="4.5" stroke-linecap="round"/><path d="M29 0l9 5.5-9 5.5z" fill="#D73F09"/><path d="M38 21c0 6-9 10-21 10h-4" stroke="#D73F09" stroke-width="4.5" stroke-linecap="round"/><path d="M15 25.5L6 31l9 5.5z" fill="#D73F09"/></svg>Tap to see on model</span><span class="h2"><svg class="swapIc" width="22" height="18" viewBox="0 0 44 36" fill="none" aria-hidden="true"><path d="M6 15C6 9 15 5 27 5h4" stroke="#D73F09" stroke-width="4.5" stroke-linecap="round"/><path d="M29 0l9 5.5-9 5.5z" fill="#D73F09"/><path d="M38 21c0 6-9 10-21 10h-4" stroke="#D73F09" stroke-width="4.5" stroke-linecap="round"/><path d="M15 25.5L6 31l9 5.5z" fill="#D73F09"/></svg>Tap to see products</span></div><button type="button" class="tapZone" data-peek aria-label="See this outfit on a model"></button>`:""}</div>
      <div class="info">
        <div class="count">${countText(cur)} <span>· Pick your outfit</span></div>
        <h3>${esc(o.name)}</h3>${list}
        <div class="ofrow"><div class="dots">${shown.map((_,j)=>`<button type="button" class="${j===k?"on":""}" data-dot="${j}" aria-label="Show outfit ${j+1}"></button>`).join("")}</div>
          <span class="swipe">${k+1} of ${shown.length} · Swipe <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <button type="button" class="btn primary pick" data-pick="${k}">${sel?"Selected · Continue":"Choose this outfit"}</button>
      </div></article>`;
  }).join("");
  carousel.querySelectorAll("[data-peek]").forEach(b=>b.onclick=()=>{
    const card=b.closest(".ofit"), on=card.classList.toggle("flipped");
    b.setAttribute("aria-label", on ? "See the products" : "See this outfit on a model");
  });
  carousel.querySelectorAll("[data-dot]").forEach(d=>d.onclick=()=>goCard(+d.dataset.dot));
  carousel.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.pick; form.elements.outfit.value = shown[k].sheet;
    carousel.querySelectorAll(".ofit").forEach(c=>{ const on=+c.dataset.k===k; c.classList.toggle("sel",on); c.querySelector(".pick").textContent = on?"Selected · Continue":"Choose this outfit"; });
    setTimeout(next,220);
  });
  const k = shown.findIndex(o=>o.sheet===chosen);
  requestAnimationFrame(()=>{ carousel.scrollLeft = Math.max(0,k)*carousel.clientWidth; });
  // first visit: nudge the cards left so the next outfit peeks in
  carousel.classList.remove("nudge");
  if (!chosen && shown.length>1 && !matchMedia("(prefers-reduced-motion: reduce)").matches){ void carousel.offsetWidth; carousel.classList.add("nudge"); }
}
carousel.addEventListener("scroll",()=>{ if (carousel.scrollLeft>20) carousel.querySelectorAll(".swipeHint").forEach(h=>h.classList.add("gone")); },{passive:true});
carousel.addEventListener("keydown",e=>{ const k=Math.round(carousel.scrollLeft/carousel.clientWidth);
  if(e.key==="ArrowRight") goCard(Math.min(shown.length-1,k+1)); if(e.key==="ArrowLeft") goCard(Math.max(0,k-1)); });
// switching gender clears an outfit picked for the other gender
$$('input[name="gender"]').forEach(r=>r.addEventListener("change",()=>{
  const o = OUTFITS.find(x=>x.sheet===val("outfit")); if (o && o.gender!==val("gender")) form.elements.outfit.value="";
}));

/* product-specific sizes */
const sizes = {};   // Hollister product code -> size
const outfitObj = ()=> OUTFITS.find(o=>o.sheet===val("outfit"));
const slotItem = slot => outfitObj()?.items[slot];
const skip = i => SLIDES[i] && SLIDES[i].type==="psize" && !!outfitObj() && !slotItem(SLIDES[i].slot);
function countText(i){
  const qs = SLIDES.map((s,j)=>j).filter(j=>SLIDES[j].key && !skip(j));
  return `${String(qs.indexOf(i)+1).padStart(2,"0")} / ${qs.length}`;
}
function renderPsize(i){
  const el = $(`.slide[data-i="${i}"]`), item = slotItem(SLIDES[i].slot); if (!item) return;
  const [code,label,cat] = item, [nm,color] = label.split(" · ");
  const run = SIZE_RUNS[val("gender")] || SIZE_RUNS["Men's"];
  el.querySelector(".pcard img").src = SRC("cut",code); el.querySelector(".pcard img").alt = label;
  el.querySelector(".q").textContent = CAT[cat].q;
  el.querySelector(".pname").innerHTML = `${esc(nm)}${color?` <span>· ${esc(color)}</span>`:""}`;
  el.querySelector(".sizes").innerHTML = run.map(v=>`<label class="size opt"><input type="radio" name="ps_${code}" value="${v}" ${sizes[code]===v?"checked":""}><b>${v}</b></label>`).join("");
  el.querySelectorAll(".sizes input").forEach(r=>r.addEventListener("change",()=>{ sizes[code]=r.value; el.querySelector(".err").textContent="";
    setTimeout(()=>{ if(cur===i) next(); },280); }));
}

let ZIPS = null;
(async()=>{ try{
  const bytes = Uint8Array.from(atob(ZIPDATA), c=>c.charCodeAt(0));
  const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  ZIPS = new Map(txt.split("\n").map(l=>{ const [z,c,s]=l.split("|"); return [z,[c,s]]; }));
}catch(_){ ZIPS = null; } })();
let autoFilled = {city:"", state:""};
function fillFromZip(){
  const hit = ZIPS && ZIPS.get(val("zip"));
  if (!hit) return;
  const [city, st] = hit;
  // only overwrite fields that are empty or that we filled in last time
  if (!val("city") || val("city")===autoFilled.city){ form.elements.city.value = city; autoFilled.city = city; }
  if (!val("state") || val("state")===autoFilled.state){ form.elements.state.value = st; autoFilled.state = st; }
}
function showAutoNotes(){
  $$("[data-auto]").forEach(n=>{ const k=n.dataset.auto; n.hidden = !(val(k) && val(k)===autoFilled[k]); });
}
["city","state"].forEach(k=>form.elements[k].addEventListener("input",showAutoNotes));
form.elements.state.addEventListener("change",showAutoNotes);

/* ---------- validation ---------- */
function val(k){ const el = form.elements[k]; if(!el) return ""; if (el.type==="checkbox") return el.checked ? el.value : ""; return (el.value ?? "").toString().trim(); }
function validate(i){
  const s = SLIDES[i]; if (!s.key) return true;
  if (s.type==="psize"){
    const item = slotItem(s.slot), ok = !item || !!sizes[item[0]];
    const el = $(`.slide[data-i="${i}"]`); el.querySelector(".err").textContent = ok ? "" : "Pick a size to keep going.";
    if (!ok){ const b=el.querySelector(".body"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
    return ok;
  }
  const v = val(s.key); let msg = "";
  if (!v) msg = s.type==="terms" ? "Check the box to agree before you continue." : ["gender","size","outfit","state"].includes(s.type) ? (s.type==="outfit"?"Choose an outfit to keep going.":"Pick one to keep going.") : "This one's required.";
  else if (s.check){ const r = s.check(v); if (r!==true) msg = r; }
  const slide = $(`.slide[data-i="${i}"]`);
  slide.querySelector(".err").textContent = msg;
  if (msg){ const b = slide.querySelector(".body")||slide; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
  return !msg;
}

/* ---------- navigation ---------- */
const FRAMED = ()=> matchMedia("(min-width:600px) and (hover:hover) and (pointer:fine)").matches;
function show(i){
  if (i<0 || i>=SLIDES.length) return;
  if (SLIDES[cur].key==="zip" && i>cur) fillFromZip();
  $$(".slide").forEach(el=>{ const n=+el.dataset.i; el.classList.toggle("active",n===i); el.classList.toggle("left",n<i); });
  $$("#bars i").forEach((b,n)=>{ b.classList.toggle("done",n<i); b.classList.toggle("now",n===i); b.hidden = skip(n); });
  cur = i;
  const cn = $(`.slide[data-i="${i}"] [data-n]`); if (cn) cn.textContent = countText(i);
  if (SLIDES[i].type==="psize") renderPsize(i);
  $("#top").classList.toggle("hideLock", i===0);
  $("#backArrow").hidden = (i===0 || SLIDES[i].type==="done");
  if (SLIDES[i].type==="review") buildReview();
  if (SLIDES[i].type==="done") playDone();
  if (SLIDES[i].auto) showAutoNotes();
  if (SLIDES[i].type==="outfit") renderOutfits();
  // Focus right away (not after the animation) so a phone keeps its keyboard open between typing slides
  const inp = $(`.slide[data-i="${i}"] input.big, .slide[data-i="${i}"] select.big`);
  if (inp && inp.tagName==="INPUT") inp.focus({preventScroll:true});
  else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  syncFakeKeyboard();
}
function next(){
  if (!validate(cur)) return;
  let j = cur+1; while (skip(j)) j++;
  if (SLIDES[j]?.type==="done") submit(); else show(j);
}
form.addEventListener("submit",e=>{ e.preventDefault(); next(); });
// Enter in the street field jumps to the apt line instead of skipping it
form.elements["street"].addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); form.elements["street2"].focus(); }});
form.elements["zip"].addEventListener("input",e=>{ e.target.value = e.target.value.replace(/\D/g,"").slice(0,5); });

/* ---------- keyboard handling ---------- */
// Real phone: keep the whole story inside the visible area above the keyboard, so Next sits right on top of it.
const vv = window.visualViewport;
function fitToViewport(){
  if (FRAMED() || !vv) { story.style.height=""; story.style.transform=""; return; }
  story.style.height = vv.height + "px";
  story.style.transform = `translateY(${vv.offsetTop}px)`;
  story.classList.toggle("kb", vv.height < window.innerHeight * 0.8);
  window.scrollTo(0,0);
}
if (vv){ vv.addEventListener("resize",fitToViewport); vv.addEventListener("scroll",fitToViewport); }
// Desktop preview: show a pretend iPhone keyboard while a text box is focused.
function syncFakeKeyboard(){
  if (!FRAMED()) return;
  const a = document.activeElement, typing = a && a.matches && a.matches("input.big");
  story.classList.toggle("kb", !!typing);
  $("#fakekb").classList.toggle("num", !!(typing && a.inputMode==="numeric"));
}
form.addEventListener("focusin",()=>setTimeout(syncFakeKeyboard,0));
form.addEventListener("focusout",()=>setTimeout(syncFakeKeyboard,60));

/* ---------- end card ---------- */
function playDone(){
  const el = $(".slide.done"), o = outfitObj();
  const fn = val("first_name");
  $("#doneMsg").textContent = `${fn ? `Thanks, ${fn}. ` : ""}We'll ship your ${CAMPAIGN} outfit to the address you gave us.`;
  if (o){
    $("#doneImg").src = o.looks?.length ? SRC("look",o.looks[0]) : SRC("cut",o.items[0][0]);
    $("#doneName").textContent = o.name;
    $("#doneSizes").innerHTML = o.items.map(([code,label])=>{ const [nm,color]=label.split(" · ");
      return `<li><div><b>${esc(nm)}</b><small>${esc(color||"")}</small></div><span>${esc(sizes[code]||"—")}</span></li>`; }).join("");
  }
  $("#doneDate").textContent = DELIVERY_WINDOW || "Date coming soon";
  el.classList.remove("play"); void el.offsetWidth; el.classList.add("play");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = el.querySelector(".confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio||1;
  const W = cv.width = cv.clientWidth*dpr, H = cv.height = cv.clientHeight*dpr;
  const colors = ["#D73F09","#FAF8F5","#D73F09","#FAF8F5"];
  const bits = Array.from({length:140},()=>({x:W*.5,y:H*.32,vx:(Math.random()-.5)*18*dpr,vy:(-Math.random()*16-6)*dpr,
    w:(5+Math.random()*6)*dpr,h:(8+Math.random()*8)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[Math.random()*4|0]}));
  const t0 = performance.now();
  (function frame(t){
    const age = t - t0; ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{ b.vy += .55*dpr; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - age/2600); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore(); });
    if (age < 2600) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- data ---------- */
function collect(){
  const street = [val("street"), val("street2")].filter(Boolean).join(", ");
  return {
    terms:val("terms"), first_name:val("first_name"), last_name:val("last_name"), instagram:val("instagram").replace(/^@?/,"@"),
    school:val("school"), gender:val("gender"), outfit:val("outfit"),
    // One size per piece, matching the Sheet's PUFFER · HOODIE · SHIRT · PANTS columns.
    // Pieces the outfit doesn't include stay "N/A". (Hollister already knows each outfit's SKUs.)
    puffer_size:"N/A", hoodie_size:"N/A", shirt_size:"N/A", pants_size:"N/A",
    ...Object.fromEntries((outfitObj()?.items||[]).map(([code,,cat])=>[CAT[cat].col+"_size", sizes[code]||""])),
    zip:val("zip"), city:val("city"), state:val("state"), street,
  };
}
function buildReview(){
  const d = collect(), o = outfitObj(), go = k => SLIDES.findIndex(s=>s.key===k);
  const CATN = {jacket:"Jacket size",hoodie:"Hoodie size",top:"Top size",pants:"Sweatpants size"};
  const rows = [
    ["Name", `${d.first_name} ${d.last_name}`, go("first_name")],
    ["Instagram", d.instagram, go("instagram")],
    ["School", d.school, go("school")],
    ["Gender", d.gender, go("gender")],
    ["Outfit", o?.name || "—", go("outfit")],
    ...(o?.items||[]).map(([code,label,cat],slot)=>[CATN[cat], sizes[code]||"—", SLIDES.findIndex(s=>s.type==="psize"&&s.slot===slot)]),
    ["Ship to", `${d.street}, ${d.city}, ${d.state} ${d.zip}`, go("zip")],
  ];
  $("#review").innerHTML = `<div class="rvList">${rows.map(([l,v,g])=>`<button type="button" class="rvRow" data-go="${g}"><span>${esc(l)}</span><b>${esc(v)}</b><i aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>Edit</i></button>`).join("")}</div>`;
  $$("#review [data-go]").forEach(r=>r.onclick=()=>show(+r.dataset.go));
}

async function submit(){
  const btn = $(`.slide[data-i="${cur}"] .btn.primary`); btn.disabled = true; btn.textContent = "Sending…";
  const row = collect();
  try{
    if (TEST){
      await new Promise(r=>setTimeout(r,500));
      row.timestamp = new Date().toLocaleString();
      let log=[]; try{ log = JSON.parse(localStorage.getItem("pg_fgf_test_rows")||"[]"); log.push(row); localStorage.setItem("pg_fgf_test_rows",JSON.stringify(log)); }catch(_){}
      $("#devrow").textContent = JSON.stringify(row,null,2); $("#devbox").hidden = false;
    } else {
      // Send to the Hub endpoint and wait for it to confirm the Sheet saved the row.
      const res = await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({form:FORM_ID, ...row})});
      const out = await res.json().catch(()=>({}));
      if (!res.ok || !out.ok) throw new Error(out.error || "send failed");
    }
    show(cur+1);
  }catch(e){
    const err = $(`.slide[data-i="${cur}"] .err`);
    if (err) err.textContent = "Your order didn't go through. Check your connection and tap Submit again.";
  }finally{ btn.disabled=false; btn.textContent="Submit"; }
}

document.addEventListener("click",e=>{
  if (e.target.id==="again"){ Object.keys(sizes).forEach(k=>delete sizes[k]); form.reset(); autoFilled={city:"",state:""}; $("#devbox").hidden=true; show(0); }
  if (e.target.id==="dlCsv"){
    let rows=[]; try{ rows = JSON.parse(localStorage.getItem("pg_fgf_test_rows")||"[]"); }catch(_){}
    if(!rows.length) return;
    const cols = Object.keys(rows[0]), q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const csv = [cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="feel-good-fleece-test-rows.csv"; a.click();
  }
});

// Shrink the phone frame to fit shorter screens
function fitDevice(){
  const d = document.getElementById("device");
  if (!FRAMED()) { d.style.removeProperty("--fit"); return; }
  d.style.setProperty("--fit", Math.min(1, (innerHeight-70)/876, (innerWidth-40)/417));
}
addEventListener("resize",()=>{ fitDevice(); fitToViewport(); });
fitDevice(); fitToViewport();

show(0);
</script>
